name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: bun run scripts/release.ts changeset-status origin/${{ github.base_ref }}

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Build compiled binary
        run: bun run build:compile

      - name: Check compiled version
        run: test "$(./dist/orchport --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Compiled binary e2e subset
        run: ORCHPORT_E2E_BIN=./dist/orchport bun test test/e2e/cli-compiled.test.ts

      - name: Check npm package
        run: npm_config_cache=/tmp/orchport-npm-cache npm pack --dry-run

  privileged-container-non-root:
    name: Privileged E2E (non-root container)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run non-root restricted-port e2e
        run: |
          docker run --rm \
            --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            oven/bun:1.3.13 \
            sh -lc 'bun install --frozen-lockfile && ORCHPORT_PRIVILEGED_E2E=1 bun test test/e2e/privileged-container.test.ts'

  privileged-container-root:
    name: Privileged E2E (root container)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run root 443 e2e
        run: |
          docker run --rm \
            --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
            -e HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            oven/bun:1.3.13 \
            sh -lc 'bun install --frozen-lockfile && ORCHPORT_PRIVILEGED_E2E=1 bun test test/e2e/privileged-container.test.ts'
