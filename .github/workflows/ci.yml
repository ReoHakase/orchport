name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: bun run scripts/release.ts changeset-status origin/${{ github.base_ref }}

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Build compiled binary
        run: bun run build:compile

      - name: Check compiled version
        run: test "$(./dist/orchport --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Check npm package
        run: npm_config_cache=/tmp/orchport-npm-cache npm pack --dry-run
