name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect pending changesets
        id: pending-changesets
        run: |
          if find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        continue-on-error: ${{ steps.pending-changesets.outputs.found == 'true' }}
        with:
          version: bun run version-packages
          publish: bun run release:publish
          commit: "chore(release): 🔖 version packages"
          title: "chore(release): 🔖 version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Report Version PR permission issue
        if: steps.pending-changesets.outputs.found == 'true' && steps.changesets.outcome == 'failure'
        run: |
          echo "::warning::changesets/action pushed changeset-release/main but could not create the Version PR. Enable the repository setting that allows GitHub Actions to create pull requests, or open a PR from changeset-release/main manually."
