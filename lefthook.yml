commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-commit:
  commands:
    oxfmt:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun run format -- {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: bun run lint -- {staged_files}
