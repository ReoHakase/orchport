# Mirrors docs/target.md-style multi-entry monorepo (simplified)
sld: enterprise-agentic-saas
worktree: feature-auth
mode: local-port

entries:
  web: true
  api: true
  db: true
  email: true

env:
  APP_BASE_URL: "${entries.web.url}"
  NEXT_PUBLIC_API_BASE_URL: "${entries.api.url}"
  API_PUBLIC_URL: "${entries.api.url}"
  BETTER_AUTH_URL: "${entries.api.url}"
  TRUSTED_ORIGINS: "${entries.web.url}"
  CORS_ORIGIN: "${entries.web.url}"
  TURSO_DATABASE_URL: "${entries.db.url}"
  ORCHPORT_WEB_PORT: "${entries.web.port}"
  ORCHPORT_API_PORT: "${entries.api.port}"
  ORCHPORT_DB_PORT: "${entries.db.port}"
  ORCHPORT_EMAIL_PORT: "${entries.email.port}"
